<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optimized AES Visualizer</title>
    <link rel="stylesheet" href="../static/index.css">
    <link rel="icon" href="../static/AESLogo.png" />

    <style>
        .flex-container {
            display: flex;
            justify-content: center;
            gap: 80px;
            align-items: stretch;
            padding-top: 20px;
        }

        .form-column {
            display: flex;
            flex-direction: column;
            width: 400px;
        }

        .form-row {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            height: 40px;
            margin-bottom: 20px;
        }

        .form-row label {
            color: #3399ff;
            font-weight: bold;
            font-size: 1.1rem;
            margin-right: 15px;
            white-space: nowrap;
        }

        .form-row input[type="text"],
        .form-row select {
            width: 180px;
            height: 30px;
            box-sizing: border-box;
        }

        .button-row {
            margin-top: auto;
            display: flex;
            justify-content: center;
            padding-top: 20px;
        }

        .submit_button {
            background-color: #4a76c6;
            color: white;
            border: none;
            padding: 10px 40px;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 5px;
        }

        @media (max-width: 900px) {
            .flex-container {
                flex-direction: column;
                align-items: center;
                gap: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="App">
        <header class="App-header">
          <img src="../static/logo512.png" class="App-logo" alt="logo"/>
          <h1>OPTIMIZED ADVANCED ENCRYPTION STANDARD <br/> VISUALIZER</h1>

          <div class="flex-container">

            <form class="form-column" action="/encrypt" method="POST">
                <div class="form-row">
                    <label for="enc_plaintext">Enter the Plain Text:</label>
                    <input type="text" name="plaintext" id="enc_plaintext">
                </div>

                <div class="form-row">
                    <label for="enc_key_size">Select Key Size:</label>
                    <select name="key_size" id="enc_key_size">
                        <option value="128">128-Bit</option>
                        <option value="192">192-Bit</option>
                        <option value="256">256-Bit</option>
                    </select>
                </div>

                <div class="form-row">
                    <label for="enc_key">Enter the Key:</label>
                    <input type="text" name="key" id="enc_key">
                </div>

                <div class="button-row">
                    <input type="Submit" class="submit_button" value="Encrypt">
                </div>
            </form>

            <form class="form-column" action="/decrypt" method="POST">
                <div class="form-row">
                    <label for="dec_ciphertext">Enter the Cipher Text:</label>
                    <input type="text" name="ciphertext" id="dec_ciphertext">
                </div>

                <div class="form-row">
                    <label for="dec_key_size">Select Key Size:</label>
                    <select name="key_size" id="dec_key_size">
                        <option value="128">128-Bit</option>
                        <option value="192">192-Bit</option>
                        <option value="256">256-Bit</option>
                    </select>
                </div>

                <div class="form-row">
                    <label for="dec_key">Enter the Key:</label>
                    <input type="text" name="key" id="dec_key">
                </div>

                <div class="button-row">
                    <input type="Submit" class="submit_button" value="Decrypt">
                </div>
            </form>

          </div>
          <br/>
        </header>

      </div>

</body>
</html>
